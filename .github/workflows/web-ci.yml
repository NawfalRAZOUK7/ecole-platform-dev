name: Web CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - "web/**"
      - "backend/docs/openapi.json"
      - "backend/openapi.json"
      - "backend/scripts/export_openapi.py"
      - "scripts/generate-openapi.sh"
      - ".github/workflows/web-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - "backend/docs/openapi.json"
      - "backend/openapi.json"
      - "backend/scripts/export_openapi.py"
      - "scripts/generate-openapi.sh"
      - ".github/workflows/web-ci.yml"

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: web/node_modules
          key: "node-modules-${{ hashFiles('web/package-lock.json') }}"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            target: tests/unit/api/
          - name: features-academic-billing
            target: tests/unit/features/academic/ tests/unit/features/billing/
          - name: features-content-lms
            target: tests/unit/features/content/ tests/unit/features/lms/
          - name: features-other
            target: tests/unit/features/admin/ tests/unit/features/ai/ tests/unit/features/auth/ tests/unit/features/communication/ tests/unit/features/reports/ tests/unit/features/school/ tests/unit/features/sync/ tests/unit/features/user/
          - name: shared-app-core
            target: tests/unit/app/ tests/unit/core/ tests/unit/entities/ tests/unit/pages/ tests/unit/services/ tests/unit/shared/ tests/unit/widgets/ tests/unit/auth-context.test.tsx
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: web/node_modules
          key: "node-modules-${{ hashFiles('web/package-lock.json') }}"
      - run: npm ci
      - run: npm run test -- ${{ matrix.target }} --reporter=default --reporter=junit --outputFile=test-results-${{ matrix.name }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.name }}
          path: web/test-results-${{ matrix.name }}.xml

  coverage:
    runs-on: ubuntu-latest
    needs: unit-tests
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: web/node_modules
          key: "node-modules-${{ hashFiles('web/package-lock.json') }}"
      - run: npm ci
      - run: npm run test:coverage -- tests/unit/ --maxWorkers=1 --minWorkers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: web/coverage/

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: web/coverage
          flags: web
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: web/node_modules
          key: "node-modules-${{ hashFiles('web/package-lock.json') }}"
      - run: npm ci
      - run: npm run build
      - name: Check bundle sizes
        run: |
          MAX_SIZE=307200  # 300KB
          for f in dist/assets/*.js; do
            size=$(stat -c%s "$f")
            if [ "$size" -gt "$MAX_SIZE" ]; then
              echo "WARNING: $(basename "$f") is $(($size/1024))KB (limit 300KB)"
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: web/dist/
