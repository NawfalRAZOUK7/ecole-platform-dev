name: Web CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - "web/**"
      - "backend/docs/openapi.json"
      - "backend/openapi.json"
      - "backend/scripts/export_openapi.py"
      - "scripts/generate-openapi.sh"
      - ".github/workflows/web-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - "backend/docs/openapi.json"
      - "backend/openapi.json"
      - "backend/scripts/export_openapi.py"
      - "scripts/generate-openapi.sh"
      - ".github/workflows/web-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node app
        uses: ./.github/actions/setup-node-app
      - run: npx tsc --noEmit
      - run: npm run lint

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: lint-and-typecheck
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            target: tests/unit/api/
          - name: features-academic
            target: tests/unit/features/academic/
          - name: features-billing
            target: tests/unit/features/billing/
          - name: features-content-lms
            target: tests/unit/features/content/ tests/unit/features/lms/
          - name: features-other
            target: tests/unit/features/admin/ tests/unit/features/ai/ tests/unit/features/auth/ tests/unit/features/communication/ tests/unit/features/reports/ tests/unit/features/school/ tests/unit/features/sync/ tests/unit/features/user/
          - name: shared-app-core
            target: tests/unit/app/ tests/unit/core/ tests/unit/entities/ tests/unit/pages/ tests/unit/services/ tests/unit/shared/ tests/unit/widgets/ tests/unit/auth-context.test.tsx
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node app
        uses: ./.github/actions/setup-node-app
      - run: npm run test -- ${{ matrix.target }} --maxWorkers=1 --reporter=default --reporter=junit --outputFile=test-results-${{ matrix.name }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.name }}
          path: web/test-results-${{ matrix.name }}.xml

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: unit-tests
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node app
        uses: ./.github/actions/setup-node-app
      - run: npm run test:coverage -- tests/unit/ --maxWorkers=1 --fileParallelism=false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: web/coverage/

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: web/coverage
          flags: web-unit
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: lint-and-typecheck
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node app
        uses: ./.github/actions/setup-node-app
      - run: npm run build
      - name: Check bundle sizes
        run: |
          MAX_SIZE=307200  # 300KB
          for f in dist/assets/*.js; do
            size=$(stat -c%s "$f")
            if [ "$size" -gt "$MAX_SIZE" ]; then
              echo "WARNING: $(basename "$f") is $(($size/1024))KB (limit 300KB)"
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: web/dist/
