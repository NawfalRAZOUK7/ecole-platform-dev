# Production environment overrides

global:
  domain: ecole-platform.example
  tlsSecret: ecole-prod-tls

backend:
  replicas: 2
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 70
  env:
    APP_ENV: production
    LOG_LEVEL: WARNING
    CORS_ORIGINS: "https://ecole-platform.example"
    ENABLE_TRACING: "true"
    ENABLE_STRICT_RATE_LIMIT: "true"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 1Gi

worker:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

web:
  replicas: 2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 128Mi

ingress:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod

pdb:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true            # also restricts ingress + pod-to-pod, the main value
  s3Egress:
    # Port 443 = external HTTPS (OAuth, SMS, email — and AWS S3 after migration).
    # Port 9000 = INTERIM MinIO object storage. Remove 9000 once on AWS S3.
    ports:
      - 443
      - 9000
    # cidrs: destination ranges for the ports above.
    #  - INTERIM (MinIO): set to your MinIO host CIDR if it has a fixed address; else 0.0.0.0/0.
    #  - AWS S3 cutover: prefer an S3 VPC Gateway Endpoint prefix-list (traffic stays internal),
    #    or 0.0.0.0/0 on port 443 only. Do NOT hand-maintain S3 IP ranges from ip-ranges.json.
    cidrs:
      - "0.0.0.0/0"        # interim — tighten at AWS S3 cutover per the note above
