# Dockerised test runner — ONE source of truth.
#
# This file is an *override* applied ON TOP of docker-compose.dev.yml. It adds a
# single `tests` service (in the `tests` profile, so it never starts on
# `make up`) that REUSES the real dev containers — ecole-postgres, ecole-redis,
# ecole-minio, ecole-mock-oauth on the ecole-network — instead of spinning up a
# duplicate stack. Tests run against an ISOLATED database `ecole_platform_test`,
# so your real `ecole_platform` data is never written.
#
# Coverage / junit / benchmarks are written to ./test-artifacts on the host.
#
# Run (wrapped by the Makefile `dtest*` targets):
#   docker compose --env-file .env \
#     -f infra/docker-compose.dev.yml -f infra/docker-compose.test.override.yml \
#     --profile tests run --rm tests integration
#
# Replaces the old separate stacks (docker-compose.tests.yml / .api-test.yml).

services:
  tests:
    profiles: ["tests"]
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: development
    image: ecole-backend-tests:dev
    container_name: ecole-tests-runner
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      APP_ENV: test
      # Same credentials as the dev Postgres (resolved from the same .env).
      POSTGRES_USER: ${POSTGRES_USER:-ecole}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecole}
      TEST_DB_HOST: postgres
      TEST_DB_PORT: "5432"
      TEST_DATABASE_NAME: ecole_platform_test
      # Isolated test database on the SAME Postgres — real ecole_platform untouched.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ecole}:${POSTGRES_PASSWORD:-ecole}@postgres:5432/ecole_platform_test
      TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ecole}:${POSTGRES_PASSWORD:-ecole}@postgres:5432/ecole_platform_test
      REDIS_URL: redis://:${REDIS_PASSWORD:-change-me-dev-redis}@redis:6379/1
      JWT_SECRET_KEY: test-secret-key-ci-only
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      MOCK_SMS_ENABLED: "true"
      MOCK_OAUTH_ENABLED: "true"
      MOCK_OAUTH_BASE_URL: http://mock-oauth:9999
      STORAGE_BACKEND: local
      DOCUMENT_STORAGE_BACKEND: local
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ecole-test-private
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin123
      S3_FORCE_PATH_STYLE: "true"
      S3_SSE_ENABLED: "false"
      RESET_TEST_DB: "1"
      SEED_ON_STARTUP: "false"
      TEST_ARTIFACT_ROOT: /artifacts/test-runs/manual
    working_dir: /app
    volumes:
      - ../backend/app:/app/app
      - ../backend/alembic:/app/alembic
      - ../backend/tests:/app/tests
      - ../backend/scripts:/app/scripts
      - ../backend/alembic.ini:/app/alembic.ini:ro
      - ../backend/pytest.ini:/app/pytest.ini:ro
      - ../backend/pyproject.toml:/app/pyproject.toml:ro
      - ../scripts:/workspace/scripts:ro
      - ../test-artifacts:/artifacts/test-runs
    networks:
      - ecole-network
    entrypoint: ["/bin/sh", "/app/scripts/docker-test-entrypoint.sh"]
    command: ["unit"]
